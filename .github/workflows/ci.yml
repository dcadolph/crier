name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Lint
        run: |
          xcrun swift-format --version
          make lint

      - name: Test
        run: make test

      - name: Build universal app
        run: make app ARCHS="arm64 x86_64"
